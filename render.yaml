services:
  - type: web
    name: arka-bank
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn arka.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
